<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">

  <!-- axis -->
  <text x="80" y="175" fill="#5a6274" font-size="19" letter-spacing="0.3" text-anchor="start">지금 정해야 한다(유선)</text>
  <text x="1120" y="175" fill="#5a6274" font-size="19" letter-spacing="0.3" text-anchor="end">나중에도 된다(무선)</text>
  <line x1="80" y1="200" x2="1120" y2="200" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ticks -->
  <line x1="150" y1="206" x2="150" y2="240" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="326" y1="206" x2="326" y2="240" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="502" y1="206" x2="502" y2="240" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="678" y1="206" x2="678" y2="240" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="854" y1="206" x2="854" y2="240" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1030" y1="206" x2="1030" y2="240" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Node 1: 접점 스위치 -->
  <g>
    <text x="150" y="290" fill="#e9ecf2" font-size="28" font-weight="600" text-anchor="middle">접점 스위치</text>
    <line x1="118" y1="302" x2="182" y2="302" stroke="#ffb454" stroke-width="2"/>
    <text x="150" y="335" fill="#8b93a5" font-size="20" letter-spacing="0.2" text-anchor="middle">가장 단순한 방식</text>
  </g>

  <!-- Node 2: 스마트 스위치(중성선!) -->
  <g>
    <text x="326" y="278" fill="#e9ecf2" font-size="26" font-weight="600" text-anchor="middle">스마트 스위치</text>
    <text x="326" y="308" fill="#e9ecf2" font-size="26" font-weight="600" text-anchor="middle">(중성선!)</text>
    <line x1="286" y1="320" x2="366" y2="320" stroke="#ffb454" stroke-width="2"/>
    <text x="326" y="345" fill="#8b93a5" font-size="20" letter-spacing="0.2" text-anchor="middle">앱·음성 제어 가능</text>
  </g>

  <!-- Node 3: 인너 릴레이 -->
  <g>
    <text x="502" y="290" fill="#e9ecf2" font-size="28" font-weight="600" text-anchor="middle">인너 릴레이</text>
    <line x1="470" y1="302" x2="534" y2="302" stroke="#ffb454" stroke-width="2"/>
    <text x="502" y="335" fill="#8b93a5" font-size="20" letter-spacing="0.2" text-anchor="middle">매입 배선판에 설치</text>
  </g>

  <!-- Node 4: 0-10V -->
  <g>
    <text x="678" y="290" fill="#e9ecf2" font-size="28" font-weight="600" text-anchor="middle">0-10V</text>
    <line x1="646" y1="302" x2="710" y2="302" stroke="#ffb454" stroke-width="2"/>
    <text x="678" y="335" fill="#8b93a5" font-size="20" letter-spacing="0.2" text-anchor="middle">아날로그 디밍 표준</text>
  </g>

  <!-- Node 5: DALI -->
  <g>
    <text x="854" y="290" fill="#e9ecf2" font-size="28" font-weight="600" text-anchor="middle">DALI</text>
    <line x1="822" y1="302" x2="886" y2="302" stroke="#ffb454" stroke-width="2"/>
    <text x="854" y="335" fill="#8b93a5" font-size="20" letter-spacing="0.2" text-anchor="middle">그룹 주소 제어 가능</text>
  </g>

  <!-- Node 6: Zigbee / Matter (wireless) -->
  <g>
    <text x="1030" y="278" fill="#58b7ff" font-size="26" font-weight="600" text-anchor="middle">Zigbee /</text>
    <text x="1030" y="308" fill="#58b7ff" font-size="26" font-weight="600" text-anchor="middle">Matter</text>
    <text x="1030" y="345" fill="#8b93a5" font-size="20" letter-spacing="0.2" text-anchor="middle">허브 기반 무선 확장</text>
  </g>

  <!-- legend -->
  <line x1="540" y1="628" x2="580" y2="628" stroke="#ffb454" stroke-width="2"/>
  <text x="540" y="620" fill="#e9ecf2" font-size="20" text-anchor="start">유선</text>
  <text x="660" y="620" fill="#58b7ff" font-size="20" text-anchor="start">무선</text>
</svg>
