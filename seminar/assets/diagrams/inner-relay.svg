<svg viewBox="40 45 1120 510" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="lampGlowIR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#ffb454" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrIR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8b93a5" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- 분전반 -->
  <rect x="60" y="60" width="140" height="70" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="130" y="102" fill="#e9ecf2" font-size="21" text-anchor="middle">분전반</text>

  <!-- L·N 상시 전원 버스 -->
  <line x1="200" y1="80" x2="1040" y2="80" stroke="#b3702d" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="110" x2="1070" y2="110" stroke="#58b7ff" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="70" fill="#b3702d" font-size="17" text-anchor="middle">L (상시)</text>
  <text x="620" y="134" fill="#58b7ff" font-size="17" text-anchor="middle">N</text>

  <!-- 스위치 박스 (라벨은 오른쪽 위, 선이 지나지 않는 자리) -->
  <rect x="230" y="180" width="420" height="300" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="630" y="212" fill="#e9ecf2" font-size="20" font-weight="600" text-anchor="end">스위치 박스</text>
  <text x="630" y="238" fill="#8b93a5" font-size="15" text-anchor="end">중성선이 와 있어야 한다</text>

  <!-- 전원 인입: 박스 왼쪽 가장자리로 내려와 라벨을 피한다 -->
  <polyline points="260,80 260,340 432,340" fill="none" stroke="#b3702d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="290,110 290,365 432,365" fill="none" stroke="#58b7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="260" cy="80" r="4.5" fill="#b3702d"/><circle cx="290" cy="110" r="4.5" fill="#58b7ff"/>

  <!-- 이너 릴레이 -->
  <rect x="420" y="265" width="200" height="150" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffb454" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="520" y="296" fill="#e9ecf2" font-size="18" font-weight="600" text-anchor="middle">이너 릴레이</text>
  <text x="520" y="316" fill="#8b93a5" font-size="13" text-anchor="middle">스위치 조작을 제어 신호로</text>
  <text x="440" y="345" fill="#b3702d" font-size="14">L</text>
  <text x="440" y="370" fill="#58b7ff" font-size="14">N</text>
  <text x="440" y="397" fill="#e9ecf2" font-size="14">SW1</text>
  <text x="600" y="397" fill="#5a6274" font-size="13" text-anchor="end">SW2 · SW3 · SW4</text>

  <!-- 기존 벽 스위치: 플레이트 + 접점 기호. L에서 분기 → 스위치 → SW1 -->
  <line x1="330" y1="340" x2="330" y2="392" stroke="#b3702d" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="330" cy="340" r="4" fill="#b3702d"/>
  <rect x="300" y="376" width="100" height="56" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="322" y="386" width="56" height="36" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="334" cy="404" r="3.5" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <line x1="337" y1="402" x2="362" y2="390" stroke="#e9ecf2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="368" cy="404" r="3.5" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <line x1="330" y1="392" x2="330" y2="400" stroke="#b3702d" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="372,404 400,404 400,392 432,392" fill="none" stroke="#e9ecf2" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="350" y="452" fill="#8b93a5" font-size="15" text-anchor="middle">기존 벽 스위치</text>
  <text x="350" y="470" fill="#5a6274" font-size="13" text-anchor="middle">전원을 끊지 않고 SW1에 "눌림"을 전달</text>

  <!-- 제어 신호 (유선 또는 무선) -->
  <line x1="622" y1="335" x2="836" y2="335" stroke="#8b93a5" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round" marker-end="url(#arrIR)"/>
  <text x="730" y="320" fill="#8b93a5" font-size="15" text-anchor="middle">제어 신호</text>
  <text x="730" y="358" fill="#5a6274" font-size="12" text-anchor="middle">유선 또는 무선</text>

  <!-- 드라이버 + 등기구 -->
  <rect x="840" y="270" width="200" height="80" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="940" y="303" fill="#e9ecf2" font-size="17" font-weight="600" text-anchor="middle">드라이버</text>
  <text x="940" y="328" fill="#8b93a5" font-size="14" text-anchor="middle">신호를 받아 조명을 제어</text>
  <line x1="1040" y1="80" x2="1040" y2="270" stroke="#b3702d" stroke-width="4" stroke-linecap="round"/>
  <line x1="1070" y1="110" x2="1070" y2="270" stroke="#58b7ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="940" y1="350" x2="940" y2="400" stroke="#8b93a5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="940" cy="440" r="42" fill="url(#lampGlowIR)"/>
  <circle cx="940" cy="440" r="19" fill="none" stroke="#ffd9a0" stroke-width="2.5"/>
  <line x1="926.6" y1="426.6" x2="953.4" y2="453.4" stroke="#ffd9a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="953.4" y1="426.6" x2="926.6" y2="453.4" stroke="#ffd9a0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="940" y="505" fill="#8b93a5" font-size="15" text-anchor="middle">등기구</text>

  <text x="600" y="540" fill="#5a6274" font-size="17" text-anchor="middle">스위치는 신호만, 전원은 이너 릴레이와 드라이버 양쪽에 상시 — 박스에 중성선(또는 DALI 버스)이 필요하다</text>
</svg>
