<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="lampGlowIR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#ffb454" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 분전반 -->
  <rect x="60" y="60" width="140" height="70" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="130" y="102" fill="#e9ecf2" font-size="21" text-anchor="middle">분전반</text>

  <!-- L·N 상시 전원: 스위치 박스로, 그리고 등기구로 -->
  <line x1="200" y1="80" x2="1040" y2="80" stroke="#b3702d" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="110" x2="1070" y2="110" stroke="#58b7ff" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="70" fill="#b3702d" font-size="17" text-anchor="middle">L (상시)</text>
  <text x="620" y="134" fill="#58b7ff" font-size="17" text-anchor="middle">N</text>

  <!-- 스위치 박스 -->
  <rect x="230" y="180" width="420" height="300" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="252" y="212" fill="#e9ecf2" font-size="20" font-weight="600">스위치 박스</text>
  <text x="252" y="238" fill="#8b93a5" font-size="15">중성선이 와 있어야 한다</text>

  <!-- 입력 모듈 -->
  <rect x="420" y="265" width="200" height="150" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffb454" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="520" y="292" fill="#e9ecf2" font-size="17" font-weight="600" text-anchor="middle">입력 모듈</text>
  <text x="520" y="312" fill="#8b93a5" font-size="13" text-anchor="middle">예: Wi-Fi 4채널 입력 (Shelly i4 류)</text>
  <text x="440" y="345" fill="#b3702d" font-size="14">L</text>
  <text x="440" y="370" fill="#58b7ff" font-size="14">N</text>
  <text x="440" y="397" fill="#e9ecf2" font-size="14">SW1</text>
  <text x="600" y="397" fill="#5a6274" font-size="13" text-anchor="end">SW2 · SW3 · SW4</text>
  <!-- 모듈 전원 -->
  <polyline points="300,80 300,340 432,340" fill="none" stroke="#b3702d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="340,110 340,365 432,365" fill="none" stroke="#58b7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="80" r="4.5" fill="#b3702d"/><circle cx="340" cy="110" r="4.5" fill="#58b7ff"/>

  <!-- 기존 스위치: L에서 분기 → 스위치 → SW1 -->
  <circle cx="300" cy="392" r="4" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <line x1="303" y1="389" x2="340" y2="366" stroke="#e9ecf2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="360" cy="392" r="4" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <line x1="300" y1="340" x2="300" y2="388" stroke="#b3702d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="364" y1="392" x2="432" y2="392" stroke="#e9ecf2" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="330" y="432" fill="#8b93a5" font-size="15" text-anchor="middle">기존 벽 스위치</text>
  <text x="330" y="452" fill="#5a6274" font-size="13" text-anchor="middle">전원을 끊지 않고 SW1에 "눌림"을 전달</text>

  <!-- 무선 -->
  <path d="M 660 330 Q 760 280 835 320" fill="none" stroke="#58b7ff" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path d="M 666 318 a 14 14 0 0 1 0 28" fill="none" stroke="#58b7ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 672 310 a 22 22 0 0 1 0 44" fill="none" stroke="#58b7ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <text x="748" y="278" fill="#58b7ff" font-size="15" text-anchor="middle">무선 (Wi-Fi · Zigbee) — 직접 또는 허브 경유</text>

  <!-- 등기구 측: 스마트 드라이버 + 램프 -->
  <rect x="840" y="270" width="200" height="80" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="940" y="303" fill="#e9ecf2" font-size="17" font-weight="600" text-anchor="middle">스마트 드라이버</text>
  <text x="940" y="328" fill="#8b93a5" font-size="14" text-anchor="middle">상시 전원 · 명령을 받아 구동</text>
  <line x1="1040" y1="80" x2="1040" y2="270" stroke="#b3702d" stroke-width="4" stroke-linecap="round"/>
  <line x1="1070" y1="110" x2="1070" y2="270" stroke="#58b7ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="940" y1="350" x2="940" y2="400" stroke="#8b93a5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="940" cy="440" r="42" fill="url(#lampGlowIR)"/>
  <circle cx="940" cy="440" r="19" fill="none" stroke="#ffd9a0" stroke-width="2.5"/>
  <line x1="926.6" y1="426.6" x2="953.4" y2="453.4" stroke="#ffd9a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="953.4" y1="426.6" x2="926.6" y2="453.4" stroke="#ffd9a0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="940" y="505" fill="#8b93a5" font-size="15" text-anchor="middle">등기구</text>

  <text x="600" y="540" fill="#5a6274" font-size="17" text-anchor="middle">일반 스위치를 스마트 스위치로 — 스위치는 신호만, 전원은 양쪽 모두 상시 · 박스에 N 필요(Wi-Fi·Zigbee형)</text>
</svg>
