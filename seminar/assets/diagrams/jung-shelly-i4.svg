<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <style>
      .w { stroke:#e9ecf2; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .wl { stroke:#b3702d; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .wn { stroke:#58b7ff; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .ws { stroke:#e9ecf2; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .box { fill:none; stroke:#e9ecf2; stroke-opacity:.55; stroke-width:1.2; }
      .term { fill:#0b0d12; stroke:#e9ecf2; stroke-width:1.4; }
      .t { fill:#e9ecf2; font-size:13px; font-family:"SF Mono", Menlo, Consolas, monospace; }
      .lab { fill:#e9ecf2; font-size:17px; font-weight:600; }
      .sub { fill:#8b93a5; font-size:13px; }
      .dim { fill:#5a6274; font-size:13px; }
    </style>
  </defs>

  <!-- title block (CAD style) -->
  <rect x="20" y="20" width="1160" height="520" class="box"/>
  <line x1="20" y1="500" x2="1180" y2="500" class="box"/>
  <text x="34" y="524" class="dim">결선도 · 이너 릴레이 예 — JUNG 532-4 U (2구 멀티스위치, 2×2 a접점, 무전위, 중립 복귀) + Shelly i4 Gen3 (AC 110–240 V, 입력 4) · 단선도, 접지 생략</text>
  <text x="1166" y="524" class="dim" text-anchor="end">1/1</text>

  <!-- 전원 -->
  <text x="60" y="110" class="lab">분전반</text>
  <text x="60" y="130" class="sub">AC 220 V</text>
  <line x1="60" y1="160" x2="250" y2="160" class="wl"/>
  <line x1="60" y1="200" x2="250" y2="200" class="wn"/>
  <text x="66" y="154" class="t" fill="#b3702d">L</text>
  <text x="66" y="194" class="t" fill="#58b7ff">N</text>

  <!-- Shelly i4 Gen3 -->
  <rect x="250" y="80" width="300" height="300" class="box"/>
  <text x="270" y="108" class="lab">Shelly i4 Gen3</text>
  <text x="270" y="126" class="sub">입력 모듈 (스위치 박스 안)</text>
  <!-- terminals left side: L, L, N -->
  <g>
    <circle cx="250" cy="160" r="7" class="term"/><text x="262" y="164" class="t">L</text>
    <circle cx="250" cy="200" r="7" class="term"/><text x="262" y="204" class="t">N</text>
    <circle cx="250" cy="240" r="7" class="term"/><text x="262" y="244" class="t">L</text>
  </g>
  <!-- terminals right side: SW1..SW4 -->
  <g>
    <circle cx="550" cy="170" r="7" class="term"/><text x="515" y="174" class="t">SW1</text>
    <circle cx="550" cy="220" r="7" class="term"/><text x="515" y="224" class="t">SW2</text>
    <circle cx="550" cy="270" r="7" class="term"/><text x="515" y="274" class="t">SW3</text>
    <circle cx="550" cy="320" r="7" class="term"/><text x="515" y="324" class="t">SW4</text>
  </g>
  <text x="270" y="350" class="sub">SW 입력은 L 기준 (AC 모델)</text>
  <text x="270" y="368" class="sub">네온·LED 내장 스위치 사용 불가</text>

  <!-- second L → JUNG commons -->
  <polyline points="243,240 200,240 200,430 700,430" class="wl"/>
  <text x="440" y="424" class="t" fill="#b3702d">L (공통 → 융 L×2)</text>

  <!-- JUNG 532-4 U -->
  <rect x="700" y="80" width="420" height="300" class="box"/>
  <text x="720" y="108" class="lab">JUNG 532-4 U</text>
  <text x="720" y="126" class="sub">로커 2개 · 각 상/하 a접점 · 공통 L 2개, 출력 S 4개</text>

  <!-- rocker A (left) -->
  <text x="760" y="152" class="sub">로커 A</text>
  <circle cx="780" cy="200" r="7" class="term"/><text x="793" y="204" class="t">L</text>
  <!-- contacts: A-up (S, top) and A-down (S, bottom) -->
  <circle cx="860" cy="170" r="6" class="term"/><text x="873" y="174" class="t">S</text>
  <circle cx="860" cy="230" r="6" class="term"/><text x="873" y="234" class="t">S</text>
  <!-- NO push contact symbols (open) -->
  <line x1="787" y1="200" x2="815" y2="200" class="ws"/>
  <line x1="815" y1="200" x2="845" y2="182" class="ws"/>
  <line x1="815" y1="200" x2="845" y2="218" class="ws"/>
  <line x1="845" y1="170" x2="854" y2="170" class="ws"/><line x1="845" y1="170" x2="845" y2="182" class="ws" stroke-dasharray="2 3"/>
  <line x1="845" y1="230" x2="854" y2="230" class="ws"/><line x1="845" y1="230" x2="845" y2="218" class="ws" stroke-dasharray="2 3"/>
  <text x="810" y="194" class="dim">↑</text><text x="810" y="222" class="dim">↓</text>

  <!-- rocker B (right) -->
  <text x="960" y="152" class="sub">로커 B</text>
  <circle cx="980" cy="200" r="7" class="term"/><text x="993" y="204" class="t">L</text>
  <circle cx="1060" cy="170" r="6" class="term"/><text x="1073" y="174" class="t">S</text>
  <circle cx="1060" cy="230" r="6" class="term"/><text x="1073" y="234" class="t">S</text>
  <line x1="987" y1="200" x2="1015" y2="200" class="ws"/>
  <line x1="1015" y1="200" x2="1045" y2="182" class="ws"/>
  <line x1="1015" y1="200" x2="1045" y2="218" class="ws"/>
  <line x1="1045" y1="170" x2="1054" y2="170" class="ws"/><line x1="1045" y1="170" x2="1045" y2="182" class="ws" stroke-dasharray="2 3"/>
  <line x1="1045" y1="230" x2="1054" y2="230" class="ws"/><line x1="1045" y1="230" x2="1045" y2="218" class="ws" stroke-dasharray="2 3"/>
  <text x="1010" y="194" class="dim">↑</text><text x="1010" y="222" class="dim">↓</text>

  <!-- L commons fed from the L bus -->
  <polyline points="700,430 780,430 780,207" class="wl"/>
  <polyline points="780,430 980,430 980,207" class="wl"/>

  <!-- S outputs → SW1..SW4 (routed below) -->
  <polyline points="866,170 900,170 900,300 640,300 640,170 557,170" class="ws"/>
  <polyline points="866,230 920,230 920,330 620,330 620,220 557,220" class="ws"/>
  <polyline points="1066,170 1100,170 1100,360 600,360 600,270 557,270" class="ws"/>
  <polyline points="1066,230 1090,230 1090,390 580,390 580,320 557,320" class="ws"/>
  <text x="655" y="296" class="t">A↑ → SW1</text>
  <text x="655" y="326" class="t">A↓ → SW2</text>
  <text x="655" y="356" class="t">B↑ → SW3</text>
  <text x="655" y="386" class="t">B↓ → SW4</text>

  <!-- legend -->
  <line x1="60" y1="470" x2="90" y2="470" class="wl"/><text x="98" y="474" class="sub">L 활선 (갈색)</text>
  <line x1="220" y1="470" x2="250" y2="470" class="wn"/><text x="258" y="474" class="sub">N 중성선 (파랑)</text>
  <line x1="390" y1="470" x2="420" y2="470" class="ws"/><text x="428" y="474" class="sub">신호선 (a접점, 무전위)</text>
  <text x="620" y="474" class="sub">조명 전원은 별도 회로로 상시 공급 · 스위치 박스에 N 필요 (Shelly 전원)</text>
</svg>
