<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="lampGlowSN" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffb454" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- center divider -->
  <line x1="600" y1="60" x2="600" y2="600" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- LEFT: 중성선 없는 박스 -->
  <g>
    <circle cx="90" cy="92" r="6" fill="#ff6b6b"/>
    <text x="110" y="99" fill="#e9ecf2" font-size="26" font-weight="600">중성선 없는 박스 (국내 다수)</text>

    <!-- 분전반 -->
    <rect x="230" y="140" width="140" height="55" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="300" y="173" fill="#e9ecf2" font-size="20" text-anchor="middle">분전반</text>

    <!-- wire: 분전반 -> 등기구 (L, N) -->
    <line x1="280" y1="195" x2="280" y2="262" stroke="#c8824a" stroke-width="3" stroke-linecap="round"/>
    <line x1="340" y1="195" x2="340" y2="262" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
    <text x="256" y="232" fill="#c8824a" font-size="18" text-anchor="end">L</text>
    <text x="364" y="232" fill="#58b7ff" font-size="18" text-anchor="start">N</text>

    <!-- 등기구 (lamp) -->
    <circle cx="300" cy="300" r="34" fill="url(#lampGlowSN)"/>
    <circle cx="300" cy="300" r="8" fill="#ffd9a0"/>
    <text x="300" y="352" fill="#8b93a5" font-size="16" text-anchor="middle">등기구</text>

    <!-- wire: 등기구 -> 스위치 박스 (L 연락선, N 없음) -->
    <line x1="270" y1="338" x2="270" y2="430" stroke="#c8824a" stroke-width="3" stroke-linecap="round"/>
    <line x1="330" y1="338" x2="330" y2="430" stroke="#c8824a" stroke-width="3" stroke-linecap="round"/>
    <text x="246" y="388" fill="#c8824a" font-size="18" text-anchor="end">L</text>
    <text x="354" y="388" fill="#c8824a" font-size="18" text-anchor="start">연락선</text>

    <!-- 스위치 박스 -->
    <rect x="200" y="430" width="200" height="90" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="225" y="463" fill="#e9ecf2" font-size="20" font-weight="600">스위치 박스</text>
    <text x="225" y="493" fill="#ff6b6b" font-size="18">스마트 스위치 ✕</text>

    <text x="300" y="552" fill="#ff6b6b" font-size="21" font-weight="600" text-anchor="middle">상시 전원을 만들 수 없다</text>
  </g>

  <!-- RIGHT: 중성선 있는 박스 -->
  <g>
    <circle cx="690" cy="92" r="6" fill="#7dd97b"/>
    <text x="710" y="99" fill="#e9ecf2" font-size="26" font-weight="600">중성선 있는 박스</text>

    <!-- 분전반 -->
    <rect x="830" y="140" width="140" height="55" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="900" y="173" fill="#e9ecf2" font-size="20" text-anchor="middle">분전반</text>

    <!-- wire: 분전반 -> 스위치 박스 (L, N 모두) -->
    <line x1="880" y1="195" x2="880" y2="290" stroke="#c8824a" stroke-width="3" stroke-linecap="round"/>
    <line x1="940" y1="195" x2="940" y2="290" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
    <text x="856" y="247" fill="#c8824a" font-size="18" text-anchor="end">L</text>
    <text x="964" y="247" fill="#58b7ff" font-size="18" text-anchor="start">N</text>

    <!-- 스위치 박스 -->
    <rect x="800" y="290" width="200" height="90" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="825" y="323" fill="#e9ecf2" font-size="20" font-weight="600">스위치 박스</text>
    <text x="825" y="353" fill="#7dd97b" font-size="18">스마트 스위치 ✓</text>

    <!-- wire: 스위치 박스 -> 등기구 (연락선 L, N 통과) -->
    <line x1="870" y1="380" x2="870" y2="436" stroke="#c8824a" stroke-width="3" stroke-linecap="round"/>
    <line x1="930" y1="380" x2="930" y2="436" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
    <text x="846" y="412" fill="#c8824a" font-size="18" text-anchor="end">연락선</text>
    <text x="954" y="412" fill="#58b7ff" font-size="18" text-anchor="start">N</text>

    <!-- 등기구 (lamp, full glow) -->
    <circle cx="900" cy="480" r="44" fill="url(#lampGlowSN)"/>
    <circle cx="900" cy="480" r="10" fill="#ffd9a0"/>
    <text x="900" y="546" fill="#8b93a5" font-size="16" text-anchor="middle">등기구</text>

    <text x="900" y="590" fill="#7dd97b" font-size="21" font-weight="600" text-anchor="middle">전자회로가 늘 깨어 있다</text>
  </g>

  <!-- bottom caption -->
  <text x="600" y="640" fill="#5a6274" font-size="20" letter-spacing="0.3" text-anchor="middle">전기공사 때 N 한 가닥 — 나중엔 벽을 뜯어야 한다</text>
</svg>
