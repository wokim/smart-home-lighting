<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">

  <!-- LEFT PANEL: 중성선 없는 박스 -->
  <g>
    <rect x="60" y="50" width="480" height="510" rx="14" fill="#1a1e27" stroke="#ff6b6b" stroke-width="3"/>
    <text x="100" y="105" fill="#ff6b6b" font-size="27" font-weight="700">중성선 없는 박스 (국내 다수)</text>
    <line x1="100" y1="128" x2="500" y2="128" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>

    <!-- 분전반 -->
    <rect x="230" y="160" width="140" height="55" rx="8" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
    <text x="300" y="193" fill="#e9ecf2" font-size="20" text-anchor="middle">분전반</text>

    <!-- wire: 분전반 -> 등기구 (L, N) -->
    <line x1="280" y1="215" x2="280" y2="290" stroke="#c8824a" stroke-width="4"/>
    <line x1="340" y1="215" x2="340" y2="290" stroke="#58b7ff" stroke-width="4"/>
    <text x="252" y="257" fill="#c8824a" font-size="19" text-anchor="end">L</text>
    <text x="368" y="257" fill="#58b7ff" font-size="19" text-anchor="start">N</text>

    <!-- 등기구 -->
    <rect x="230" y="290" width="140" height="55" rx="8" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
    <text x="300" y="323" fill="#e9ecf2" font-size="20" text-anchor="middle">등기구</text>

    <!-- wire: 등기구 -> 스위치 박스 (L 연락선, N 없음) -->
    <line x1="270" y1="345" x2="270" y2="430" stroke="#c8824a" stroke-width="4"/>
    <line x1="330" y1="345" x2="330" y2="430" stroke="#c8824a" stroke-width="4"/>
    <text x="242" y="390" fill="#c8824a" font-size="19" text-anchor="end">L</text>
    <text x="358" y="390" fill="#c8824a" font-size="19" text-anchor="start">연락선</text>

    <!-- 스위치 박스 -->
    <rect x="200" y="430" width="200" height="90" rx="10" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
    <text x="225" y="463" fill="#e9ecf2" font-size="20" font-weight="700">스위치 박스</text>
    <text x="225" y="493" fill="#ff6b6b" font-size="18">스마트 스위치 ✕</text>

    <text x="300" y="548" fill="#ff6b6b" font-size="22" font-weight="600" text-anchor="middle">상시 전원을 만들 수 없다</text>
  </g>

  <!-- RIGHT PANEL: 중성선 있는 박스 -->
  <g>
    <rect x="660" y="50" width="480" height="510" rx="14" fill="#1a1e27" stroke="#7dd97b" stroke-width="3"/>
    <text x="700" y="105" fill="#7dd97b" font-size="27" font-weight="700">중성선 있는 박스</text>
    <line x1="700" y1="128" x2="1100" y2="128" stroke="#7dd97b" stroke-width="1" opacity="0.4"/>

    <!-- 분전반 -->
    <rect x="830" y="160" width="140" height="55" rx="8" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
    <text x="900" y="193" fill="#e9ecf2" font-size="20" text-anchor="middle">분전반</text>

    <!-- wire: 분전반 -> 스위치 박스 (L, N 모두) -->
    <line x1="880" y1="215" x2="880" y2="290" stroke="#c8824a" stroke-width="4"/>
    <line x1="940" y1="215" x2="940" y2="290" stroke="#58b7ff" stroke-width="4"/>
    <text x="852" y="257" fill="#c8824a" font-size="19" text-anchor="end">L</text>
    <text x="968" y="257" fill="#58b7ff" font-size="19" text-anchor="start">N</text>

    <!-- 스위치 박스 -->
    <rect x="800" y="290" width="200" height="90" rx="10" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
    <text x="825" y="323" fill="#e9ecf2" font-size="20" font-weight="700">스위치 박스</text>
    <text x="825" y="353" fill="#7dd97b" font-size="18">스마트 스위치 ✓</text>

    <!-- wire: 스위치 박스 -> 등기구 (연락선 L, N 통과) -->
    <line x1="870" y1="380" x2="870" y2="465" stroke="#c8824a" stroke-width="4"/>
    <line x1="930" y1="380" x2="930" y2="465" stroke="#58b7ff" stroke-width="4"/>
    <text x="842" y="425" fill="#c8824a" font-size="19" text-anchor="end">연락선</text>
    <text x="958" y="425" fill="#58b7ff" font-size="19" text-anchor="start">N</text>

    <!-- 등기구 -->
    <rect x="830" y="465" width="140" height="55" rx="8" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
    <text x="900" y="498" fill="#e9ecf2" font-size="20" text-anchor="middle">등기구</text>

    <text x="900" y="548" fill="#7dd97b" font-size="22" font-weight="600" text-anchor="middle">전자회로가 늘 깨어 있다</text>
  </g>

  <!-- bottom caption -->
  <text x="600" y="625" fill="#98a1b3" font-size="26" font-weight="500" text-anchor="middle">전기공사 때 N 한 가닥 — 나중엔 벽을 뜯어야 한다</text>
</svg>
