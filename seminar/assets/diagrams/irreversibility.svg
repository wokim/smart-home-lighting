  </g>

  <!-- right column: 나중에도 -->
  <g>
    <circle cx="686" cy="128" r="6" fill="#7dd97b"/>
    <text x="706" y="140" fill="#e9ecf2" font-size="46" font-weight="250" letter-spacing="-1">나중에도</text>

    <circle cx="690" cy="226" r="4" fill="#7dd97b" opacity="0.7"/>
    <text x="710" y="232" fill="#8b93a5" font-size="24" letter-spacing="0.2">스위치</text>

