  <!-- center divider with gap for rotated label -->
  <line x1="600" y1="80" x2="600" y2="280" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="10 8"/>
  <line x1="600" y1="410" x2="600" y2="600" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="10 8"/>
  <text x="600" y="345" fill="#5a6274" font-size="21" font-weight="600" letter-spacing="0.3" text-anchor="middle" transform="rotate(-90 600 345)">벽이 닫히는 순간</text>
