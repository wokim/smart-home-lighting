    <circle cx="86" cy="128" r="6" fill="#ff6b6b"/>
    <text x="106" y="140" fill="#e9ecf2" font-size="46" font-weight="250" letter-spacing="-1">지금뿐</text>

    <circle cx="90" cy="226" r="4" fill="#ff6b6b" opacity="0.7"/>
    <text x="110" y="232" fill="#8b93a5" font-size="24" letter-spacing="0.2">중성선</text>

    <circle cx="90" cy="296" r="4" fill="#ff6b6b" opacity="0.7"/>
    <text x="110" y="302" fill="#8b93a5" font-size="24" letter-spacing="0.2">제어선</text>

    <circle cx="90" cy="366" r="4" fill="#ff6b6b" opacity="0.7"/>
