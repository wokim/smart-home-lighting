<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a1b3"/>
    </marker>
  </defs>

  <!-- AC 220V -> SMPS -->
  <line x1="60" y1="320" x2="140" y2="320" stroke="#e9ecf2" stroke-width="4"/>
  <text x="100" y="308" fill="#e9ecf2" font-size="18" text-anchor="middle">AC 220V</text>

  <rect x="140" y="280" width="160" height="80" rx="10" fill="#1a1e27" stroke="#ffb454" stroke-width="3"/>
  <text x="220" y="315" fill="#e9ecf2" font-size="22" font-weight="700" text-anchor="middle">SMPS</text>
  <text x="220" y="340" fill="#98a1b3" font-size="14" text-anchor="middle">AC → DC</text>

  <!-- SMPS -> CCT 드라이버 (DC 24V) -->
  <line x1="300" y1="305" x2="470" y2="305" stroke="#ff6b6b" stroke-width="4"/>
  <text x="385" y="296" fill="#ff6b6b" font-size="17" text-anchor="middle">24V+</text>
  <line x1="300" y1="335" x2="470" y2="335" stroke="#5a6170" stroke-width="4"/>
  <text x="385" y="353" fill="#5a6170" font-size="17" font-weight="700" text-anchor="middle">24V−</text>

  <rect x="470" y="280" width="190" height="80" rx="10" fill="#1a1e27" stroke="#ffb454" stroke-width="3"/>
  <text x="565" y="312" fill="#e9ecf2" font-size="20" font-weight="700" text-anchor="middle">CCT 드라이버</text>
  <text x="565" y="337" fill="#98a1b3" font-size="15" text-anchor="middle">/ 컨트롤러</text>

  <!-- CCT 드라이버 -> 등기구 (V+ / Warm / Cold) -->
  <line x1="660" y1="295" x2="950" y2="295" stroke="#ff6b6b" stroke-width="4"/>
  <text x="805" y="287" fill="#ff6b6b" font-size="16" text-anchor="middle">V+</text>
  <line x1="660" y1="325" x2="950" y2="325" stroke="#ffb454" stroke-width="4"/>
  <text x="805" y="317" fill="#ffb454" font-size="16" text-anchor="middle">Warm</text>
  <line x1="660" y1="355" x2="950" y2="355" stroke="#58b7ff" stroke-width="4"/>
  <text x="805" y="372" fill="#58b7ff" font-size="16" text-anchor="middle">Cold</text>

  <rect x="950" y="280" width="150" height="80" rx="10" fill="#1a1e27" stroke="#e9ecf2" stroke-width="2"/>
  <text x="1025" y="312" fill="#e9ecf2" font-size="20" font-weight="700" text-anchor="middle">등기구</text>
  <text x="1025" y="337" fill="#98a1b3" font-size="14" text-anchor="middle">(CCT 모듈)</text>

  <!-- distance arrow between driver and load -->
  <line x1="662" y1="410" x2="948" y2="410" stroke="#98a1b3" stroke-width="2" marker-start="url(#arrowMuted)" marker-end="url(#arrowMuted)"/>
  <text x="805" y="435" fill="#98a1b3" font-size="18" text-anchor="middle">거리</text>

  <!-- caption -->
  <text x="600" y="525" fill="#98a1b3" font-size="24" font-weight="500" text-anchor="middle">24V는 거리가 길수록 전압강하 — 드라이버는 부하 근처에</text>
</svg>
