<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffb454" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#5a6274" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- hairline separators -->
  <line x1="80" y1="242" x2="1120" y2="242" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="80" y1="424" x2="1120" y2="424" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- layer 1: 제어 -->
  <text x="80" y="118" font-size="46" font-weight="250" fill="#e9ecf2" letter-spacing="-1">제어</text>
  <text x="80" y="158" font-size="24" font-weight="600" fill="#ffb454">그 드라이버에게 어떻게 명령하는가</text>
  <text x="80" y="193" font-size="19" fill="#8b93a5" letter-spacing="0.2">DALI · Zigbee · Matter · 0-10V 같은 제어 방식의 층</text>
  <text x="80" y="222" font-size="19" fill="#8b93a5" letter-spacing="0.2">명령 신뢰성 · 지연 · 여러 등기구의 동기화 · 그룹/씬 · 상태 피드백 · 확장성</text>

  <!-- layer 2: 드라이버 -->
  <text x="80" y="302" font-size="46" font-weight="250" fill="#e9ecf2" letter-spacing="-1">드라이버</text>
  <text x="80" y="342" font-size="24" font-weight="600" fill="#ffb454">그 빛을 얼마나 잘 구동하는가</text>
  <text x="80" y="377" font-size="19" fill="#8b93a5" letter-spacing="0.2">CC/CV 구동 · PWM / CCR / 하이브리드 디밍 방식</text>
  <text x="80" y="406" font-size="19" fill="#8b93a5" letter-spacing="0.2">디밍 레인지(100→0.1%) · low-end 안정성 · 디밍 커브 · fade · 플리커 · 디밍 중 색 안정성</text>

  <!-- layer 3: 광원 -->
  <text x="80" y="486" font-size="46" font-weight="250" fill="#e9ecf2" letter-spacing="-1">광원</text>
  <text x="80" y="526" font-size="24" font-weight="600" fill="#ffb454">어떤 빛을 만들어내는가</text>
  <text x="80" y="561" font-size="19" fill="#8b93a5" letter-spacing="0.2">LED 소자/모듈 — CRI(Ra) · R9 · 색온도 · 색 편차(SDCM) · 효율(lm/W)</text>
  <text x="80" y="590" font-size="19" fill="#8b93a5" letter-spacing="0.2">방열 설계 → 수명 · 색 안정성  /  렌즈 · 반사판 · 디퓨저 → 배광 · 눈부심</text>

  <!-- command→light flow, right side -->
  <text x="1040" y="84" font-size="19" fill="#5a6274" text-anchor="middle" letter-spacing="2">명령</text>
  <line x1="1040" y1="104" x2="1040" y2="228" stroke="#5a6274" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <line x1="1040" y1="256" x2="1040" y2="410" stroke="#5a6274" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <line x1="1040" y1="438" x2="1040" y2="520" stroke="#5a6274" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <circle cx="1040" cy="566" r="60" fill="url(#lampGlow)"/>
  <circle cx="1040" cy="566" r="13" fill="#ffd9a0"/>
  <text x="1040" y="646" font-size="19" fill="#8b93a5" text-anchor="middle" letter-spacing="2">빛</text>

  <!-- caption -->
  <text x="80" y="646" font-size="19" fill="#5a6274" letter-spacing="0.5">세 레이어는 서로를 대신하지 못한다 — 한 레이어의 결함은 다른 레이어의 좋은 부품으로 덮이지 않는다</text>
</svg>
