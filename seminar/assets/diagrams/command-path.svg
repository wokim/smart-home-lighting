<svg viewBox="20 72 950 302" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <style>
      .box{fill:none;stroke:#e9ecf2;stroke-opacity:.5;stroke-width:1.2}
      .w{stroke:#8b93a5;stroke-width:1.5;fill:none}
      .wd{stroke:#5a6274;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
      .lane{fill:#ffb454;font-size:15px;font-weight:700;letter-spacing:.06em}
      .t{fill:#e9ecf2;font-size:14px}
      .sub{fill:#8b93a5;font-size:12px}
      .dim{fill:#5a6274;font-size:12px}
      .amb{fill:#ffb454;font-size:16px;font-weight:600}
      .red{fill:#ff8f6b;font-size:16px;font-weight:600}
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#8b93a5"/>
    </marker>
    <marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#5a6274"/>
    </marker>
  </defs>

  <!-- ============ 유선 ============ -->
  <text x="36" y="116" class="lane">유선</text>

  <rect x="100" y="87" width="98" height="46" class="box"/>
  <text x="149" y="116" class="t" text-anchor="middle">벽 버튼</text>

  <line x1="200" y1="110" x2="232" y2="110" class="w" marker-end="url(#ar)"/>

  <rect x="238" y="87" width="128" height="46" class="box"/>
  <text x="302" y="116" class="t" text-anchor="middle">커플러</text>
  <text x="302" y="150" class="sub" text-anchor="middle">주소 5 · 짧게 누름</text>

  <line x1="368" y1="110" x2="402" y2="110" class="w" marker-end="url(#ar)"/>

  <rect x="408" y="87" width="120" height="46" class="box"/>
  <text x="468" y="116" class="t" text-anchor="middle">컨트롤러</text>

  <line x1="530" y1="110" x2="694" y2="110" class="w" marker-end="url(#ar)"/>
  <text x="612" y="99" class="sub" text-anchor="middle">"그룹 3을 씬 2로" 한 번</text>

  <rect x="700" y="87" width="150" height="46" class="box"/>
  <text x="775" y="116" class="t" text-anchor="middle">드라이버 7개</text>
  <text x="775" y="150" class="sub" text-anchor="middle">각자 저장한 값으로</text>

  <line x1="852" y1="110" x2="884" y2="110" class="w" marker-end="url(#ar)"/>
  <text x="900" y="116" class="amb">동시에</text>

  <!-- 상태 보고 (되돌아오는 경로) -->
  <polyline points="775,168 775,190 468,190 468,138" class="wd" marker-end="url(#ard)"/>
  <text x="622" y="184" class="dim" text-anchor="middle">상태 보고</text>

  <!-- ============ 무선 ============ -->
  <text x="36" y="282" class="lane">무선</text>

  <rect x="100" y="253" width="98" height="46" class="box"/>
  <text x="149" y="282" class="t" text-anchor="middle">벽 스위치</text>

  <line x1="200" y1="276" x2="232" y2="276" class="w" marker-end="url(#ar)"/>

  <rect x="238" y="253" width="128" height="46" class="box"/>
  <text x="302" y="282" class="t" text-anchor="middle">허브</text>
  <text x="302" y="316" class="sub" text-anchor="middle">자동화 규칙</text>

  <!-- 분기 -->
  <polyline points="368,276 400,276" class="w"/>
  <polyline points="400,276 400,238 434,238" class="w" marker-end="url(#ar)"/>
  <polyline points="400,276 400,314 434,314" class="w" marker-end="url(#ar)"/>

  <rect x="440" y="215" width="196" height="46" class="box"/>
  <text x="538" y="244" class="t" text-anchor="middle">그룹 명령 한 번</text>

  <rect x="440" y="291" width="196" height="46" class="box"/>
  <text x="538" y="320" class="t" text-anchor="middle">조명마다 개별 명령</text>

  <line x1="638" y1="238" x2="670" y2="238" class="w" marker-end="url(#ar)"/>
  <text x="686" y="244" class="amb">동시에</text>

  <line x1="638" y1="314" x2="670" y2="314" class="w" marker-end="url(#ar)"/>
  <text x="686" y="320" class="red">하나씩 순서대로</text>

  <text x="36" y="360" class="dim">로직이 어디에 있고 명령이 몇 번 나가는지가 동시성을 정한다</text>
</svg>
