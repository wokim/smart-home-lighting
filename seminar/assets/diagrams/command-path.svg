<svg viewBox="8 88 1140 342" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <style>
      .box{fill:none;stroke:#e9ecf2;stroke-opacity:.5;stroke-width:1.2}
      .w{stroke:#8b93a5;stroke-width:1.6;fill:none}
      .rf{stroke:#58b7ff;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
      .fb{stroke:#5a6274;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
      .lane{fill:#ffb454;font-size:15px;font-weight:700;letter-spacing:.06em}
      .t{fill:#e9ecf2;font-size:14px}
      .msg{fill:#e9ecf2;font-size:11.5px}
      .med{fill:#8b93a5;font-size:11px;letter-spacing:.04em}
      .medr{fill:#58b7ff;font-size:11px;letter-spacing:.04em}
      .sub{fill:#8b93a5;font-size:11.5px}
      .dim{fill:#5a6274;font-size:12px}
      .amb{fill:#ffb454;font-size:15px;font-weight:600}
      .red{fill:#ff8f6b;font-size:15px;font-weight:600}
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#8b93a5"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#58b7ff"/></marker>
    <marker id="arf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#5a6274"/></marker>
  </defs>

  <!-- ================= 유선 ================= -->
  <text x="20" y="126" class="lane">유선</text>

  <rect x="70" y="97" width="96" height="46" class="box"/>
  <text x="118" y="126" class="t" text-anchor="middle">벽 버튼</text>

  <line x1="168" y1="120" x2="238" y2="120" class="w" marker-end="url(#ar)"/>
  <text x="203" y="108" class="msg" text-anchor="middle">누름</text>
  <text x="203" y="140" class="med" text-anchor="middle">무전위 접점</text>

  <rect x="244" y="97" width="180" height="46" class="box"/>
  <text x="334" y="126" class="t" text-anchor="middle">이너 릴레이</text>
  <text x="334" y="162" class="sub" text-anchor="middle">DALI 푸시버튼 커플러</text>

  <line x1="426" y1="120" x2="554" y2="120" class="w" marker-end="url(#ar)"/>
  <text x="490" y="108" class="msg" text-anchor="middle">"주소 5, 버튼 1, 짧게 누름"</text>
  <text x="490" y="140" class="med" text-anchor="middle">DALI 버스</text>

  <rect x="560" y="97" width="120" height="46" class="box"/>
  <text x="620" y="126" class="t" text-anchor="middle">컨트롤러</text>

  <line x1="682" y1="120" x2="840" y2="120" class="w" marker-end="url(#ar)"/>
  <text x="761" y="108" class="msg" text-anchor="middle">"그룹 3을 씬 2로"</text>
  <text x="761" y="140" class="med" text-anchor="middle">DALI 버스</text>

  <rect x="846" y="97" width="152" height="46" class="box"/>
  <text x="922" y="126" class="t" text-anchor="middle">드라이버 7개</text>
  <text x="922" y="162" class="sub" text-anchor="middle">저장된 씬 값으로 페이드</text>

  <line x1="1000" y1="120" x2="1030" y2="120" class="w" marker-end="url(#ar)"/>
  <text x="1040" y="126" class="amb">동시에</text>

  <polyline points="922,178 922,200 620,200 620,146" class="fb" marker-end="url(#arf)"/>
  <text x="771" y="195" class="dim" text-anchor="middle">상태 보고</text>

  <!-- ================= 무선 ================= -->
  <text x="20" y="316" class="lane">무선</text>

  <rect x="70" y="287" width="96" height="46" class="box"/>
  <text x="118" y="316" class="t" text-anchor="middle">벽 버튼</text>

  <line x1="168" y1="310" x2="238" y2="310" class="w" marker-end="url(#ar)"/>
  <text x="203" y="298" class="msg" text-anchor="middle">누름</text>
  <text x="203" y="330" class="med" text-anchor="middle">무전위 접점</text>

  <rect x="244" y="287" width="180" height="46" class="box"/>
  <text x="334" y="316" class="t" text-anchor="middle">이너 릴레이</text>
  <text x="334" y="352" class="sub" text-anchor="middle">무선 입력 모듈</text>

  <line x1="426" y1="310" x2="554" y2="310" class="rf" marker-end="url(#arr)"/>
  <text x="490" y="298" class="msg" text-anchor="middle">"입력 1 눌림"</text>
  <text x="490" y="330" class="medr" text-anchor="middle">무선</text>

  <rect x="560" y="287" width="120" height="46" class="box"/>
  <text x="620" y="316" class="t" text-anchor="middle">허브</text>
  <text x="620" y="352" class="sub" text-anchor="middle">자동화 규칙</text>

  <polyline points="682,310 706,310" class="rf"/>
  <polyline points="706,310 706,262 740,262" class="rf" marker-end="url(#arr)"/>
  <polyline points="706,310 706,358 740,358" class="rf" marker-end="url(#arr)"/>
  <text x="723" y="392" class="medr" text-anchor="middle">무선</text>

  <rect x="746" y="239" width="192" height="46" class="box"/>
  <text x="842" y="262" class="t" text-anchor="middle">"거실 씬 2로"</text>
  <text x="842" y="279" class="med" text-anchor="middle">그룹 명령 한 번</text>

  <rect x="746" y="335" width="192" height="46" class="box"/>
  <text x="842" y="358" class="t" text-anchor="middle">"1번 30%", "2번 80%" …</text>
  <text x="842" y="375" class="med" text-anchor="middle">조명마다 개별 명령</text>

  <line x1="940" y1="262" x2="970" y2="262" class="rf" marker-end="url(#arr)"/>
  <text x="980" y="268" class="amb">동시에</text>

  <line x1="940" y1="358" x2="970" y2="358" class="rf" marker-end="url(#arr)"/>
  <text x="980" y="364" class="red">하나씩 순서대로</text>

  <text x="20" y="418" class="dim">화살표 위가 실제로 오가는 내용이다. 명령이 몇 번 나가는지가 동시성을 정한다</text>
</svg>
