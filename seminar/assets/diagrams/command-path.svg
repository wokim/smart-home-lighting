<svg viewBox="8 74 1145 372" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <style>
      .box{fill:none;stroke:#e9ecf2;stroke-opacity:.5;stroke-width:1.2}
      .w{stroke:#8b93a5;stroke-width:1.6;fill:none}
      .rf{stroke:#58b7ff;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
      .fb{stroke:#5a6274;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
      .lane{fill:#ffb454;font-size:15px;font-weight:700;letter-spacing:.06em}
      .t{fill:#e9ecf2;font-size:14px}
      .msg{fill:#e9ecf2;font-size:11.5px}
      .med{fill:#8b93a5;font-size:11px;letter-spacing:.04em}
      .medr{fill:#58b7ff;font-size:11px;letter-spacing:.04em}
      .sub{fill:#8b93a5;font-size:11.5px}
      .dim{fill:#5a6274;font-size:12px}
      .amb{fill:#ffb454;font-size:15px;font-weight:600}
      .red{fill:#ff8f6b;font-size:15px;font-weight:600}
    </style>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#8b93a5"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#58b7ff"/></marker>
    <marker id="arf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#5a6274"/></marker>
  </defs>

  <!-- ================= 유선 ================= -->
  <text x="20" y="116" class="lane">유선</text>

  <rect x="64" y="88" width="92" height="44" class="box"/>
  <text x="110" y="116" class="t" text-anchor="middle">벽 버튼</text>

  <line x1="158" y1="110" x2="228" y2="110" class="w" marker-end="url(#ar)"/>
  <text x="193" y="99" class="msg" text-anchor="middle">누름</text>
  <text x="193" y="128" class="med" text-anchor="middle">무전위 접점</text>

  <rect x="234" y="88" width="176" height="44" class="box"/>
  <text x="322" y="116" class="t" text-anchor="middle">이너 릴레이</text>
  <text x="322" y="148" class="sub" text-anchor="middle">DALI 푸시버튼 커플러</text>

  <!-- 허브도 같은 버스로 -->
  <rect x="234" y="170" width="176" height="52" class="box"/>
  <text x="322" y="192" class="t" text-anchor="middle">허브 · 게이트웨이</text>
  <text x="322" y="211" class="sub" text-anchor="middle">앱 · 음성 · 자동화</text>

  <polyline points="412,110 470,110" class="w"/>
  <polyline points="412,196 470,196 470,112" class="w"/>

  <line x1="470" y1="110" x2="644" y2="110" class="w" marker-end="url(#ar)"/>
  <text x="557" y="99" class="msg" text-anchor="middle">"그룹 3을 씬 2로"</text>
  <text x="557" y="128" class="med" text-anchor="middle">DALI 버스</text>

  <rect x="650" y="88" width="150" height="44" class="box"/>
  <text x="725" y="116" class="t" text-anchor="middle">드라이버 7개</text>
  <text x="725" y="148" class="sub" text-anchor="middle">자기에게 온 명령이면 저장값으로</text>

  <line x1="802" y1="110" x2="832" y2="110" class="w" marker-end="url(#ar)"/>
  <text x="842" y="116" class="amb">동시에</text>

  <polyline points="725,158 725,258 290,258 290,224" class="fb" marker-end="url(#arf)"/>
  <text x="510" y="253" class="dim" text-anchor="middle">상태 보고</text>

  <!-- ================= 무선 ================= -->
  <text x="20" y="340" class="lane">무선</text>

  <rect x="64" y="312" width="92" height="44" class="box"/>
  <text x="110" y="340" class="t" text-anchor="middle">벽 버튼</text>

  <line x1="158" y1="334" x2="228" y2="334" class="w" marker-end="url(#ar)"/>
  <text x="193" y="323" class="msg" text-anchor="middle">누름</text>
  <text x="193" y="352" class="med" text-anchor="middle">무전위 접점</text>

  <rect x="234" y="312" width="176" height="44" class="box"/>
  <text x="322" y="340" class="t" text-anchor="middle">이너 릴레이</text>
  <text x="322" y="372" class="sub" text-anchor="middle">무선 입력 모듈</text>

  <line x1="412" y1="334" x2="500" y2="334" class="rf" marker-end="url(#arr)"/>
  <text x="456" y="323" class="msg" text-anchor="middle">"입력 1 눌림"</text>
  <text x="456" y="352" class="medr" text-anchor="middle">무선</text>

  <rect x="506" y="308" width="140" height="52" class="box"/>
  <text x="576" y="330" class="t" text-anchor="middle">허브</text>
  <text x="576" y="349" class="sub" text-anchor="middle">자동화 규칙</text>

  <polyline points="648,334 672,334" class="rf"/>
  <polyline points="672,334 672,296 700,296" class="rf" marker-end="url(#arr)"/>
  <polyline points="672,334 672,372 700,372" class="rf" marker-end="url(#arr)"/>

  <rect x="706" y="274" width="200" height="44" class="box"/>
  <text x="806" y="294" class="msg" text-anchor="middle">"거실 씬 2로"</text>
  <text x="806" y="311" class="med" text-anchor="middle">그룹 명령 한 번</text>

  <rect x="706" y="350" width="200" height="44" class="box"/>
  <text x="806" y="370" class="msg" text-anchor="middle">"1번 30%", "2번 80%" …</text>
  <text x="806" y="387" class="med" text-anchor="middle">조명마다 개별 명령</text>

  <line x1="908" y1="296" x2="938" y2="296" class="rf" marker-end="url(#arr)"/>
  <text x="946" y="302" class="amb">동시에</text>

  <line x1="908" y1="372" x2="938" y2="372" class="rf" marker-end="url(#arr)"/>
  <text x="946" y="378" class="red">하나씩 순서대로</text>

  <text x="20" y="430" class="dim">유선은 허브가 없어도 벽 버튼이 동작한다. 무선은 허브를 거쳐야 한다</text>
</svg>
