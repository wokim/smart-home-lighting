<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="lampGlowPF" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#ffb454" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrPF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#5a6274" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- 상단: 휴대폰·음성 -->
  <text x="80" y="62" fill="#5a6274" font-size="15" letter-spacing="2">일상 조작</text>
  <rect x="300" y="36" width="260" height="58" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="430" y="61" fill="#e9ecf2" font-size="18" font-weight="600" text-anchor="middle">Apple Home</text>
  <text x="430" y="82" fill="#8b93a5" font-size="13" text-anchor="middle">폰 기본 앱 · 화면 조작</text>
  <rect x="640" y="36" width="260" height="58" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="770" y="61" fill="#e9ecf2" font-size="18" font-weight="600" text-anchor="middle">Google Home</text>
  <text x="770" y="82" fill="#8b93a5" font-size="13" text-anchor="middle">음성 명령</text>
  <!-- 양방향 연동 -->
  <line x1="430" y1="94" x2="430" y2="158" stroke="#5a6274" stroke-width="1.5" marker-start="url(#arrPF)" marker-end="url(#arrPF)"/>
  <line x1="770" y1="94" x2="770" y2="158" stroke="#5a6274" stroke-width="1.5" marker-start="url(#arrPF)" marker-end="url(#arrPF)"/>
  <text x="600" y="132" fill="#5a6274" font-size="14" text-anchor="middle">양방향 연동, 별도 앱 없이</text>

  <!-- 중단: 플랫폼 -->
  <text x="80" y="200" fill="#5a6274" font-size="15" letter-spacing="2">플랫폼</text>
  <rect x="200" y="162" width="800" height="92" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffb454" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="600" y="196" fill="#e9ecf2" font-size="22" font-weight="600" text-anchor="middle">중앙 컨트롤러 (허브)</text>
  <text x="600" y="226" fill="#8b93a5" font-size="15" text-anchor="middle">씬 · 자동화 · 센서 로직 · 기기 연동. 집의 규칙이 여기서 돈다</text>
  <text x="600" y="246" fill="#ffb454" font-size="13" text-anchor="middle">하나만 정하고 전부 모은다</text>

  <!-- 연결선 -->
  <line x1="300" y1="254" x2="300" y2="318" stroke="#5a6274" stroke-width="1.5" marker-start="url(#arrPF)" marker-end="url(#arrPF)"/>
  <line x1="460" y1="254" x2="460" y2="318" stroke="#5a6274" stroke-width="1.5" marker-start="url(#arrPF)" marker-end="url(#arrPF)"/>
  <line x1="620" y1="254" x2="620" y2="318" stroke="#5a6274" stroke-width="1.5" marker-start="url(#arrPF)" marker-end="url(#arrPF)"/>
  <line x1="800" y1="254" x2="800" y2="318" stroke="#5a6274" stroke-width="1.5" stroke-dasharray="3 6" marker-end="url(#arrPF)"/>
  <line x1="940" y1="254" x2="940" y2="318" stroke="#5a6274" stroke-width="1.5" stroke-dasharray="3 6" marker-end="url(#arrPF)"/>

  <!-- 하단: 기기 -->
  <text x="80" y="362" fill="#5a6274" font-size="15" letter-spacing="2">기기</text>
  <rect x="230" y="318" width="140" height="70" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="300" y="349" fill="#e9ecf2" font-size="16" text-anchor="middle">벽 스위치</text>
  <text x="300" y="371" fill="#8b93a5" font-size="12" text-anchor="middle">스마트 · 입력 모듈</text>
  <rect x="390" y="318" width="140" height="70" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="460" y="349" fill="#e9ecf2" font-size="16" text-anchor="middle">모션센서</text>
  <text x="460" y="371" fill="#8b93a5" font-size="12" text-anchor="middle">재실 · 조도</text>
  <rect x="550" y="318" width="140" height="70" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="620" cy="346" r="22" fill="url(#lampGlowPF)"/>
  <circle cx="620" cy="346" r="7" fill="#ffd9a0"/>
  <text x="620" y="377" fill="#8b93a5" font-size="12" text-anchor="middle">조명 · 드라이버</text>
  <rect x="730" y="318" width="140" height="70" rx="6" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="800" y="349" fill="#8b93a5" font-size="16" text-anchor="middle">냉난방</text>
  <text x="800" y="371" fill="#5a6274" font-size="12" text-anchor="middle">나중에</text>
  <rect x="870" y="318" width="140" height="70" rx="6" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="940" y="349" fill="#8b93a5" font-size="16" text-anchor="middle">커튼 · 보안</text>
  <text x="940" y="371" fill="#5a6274" font-size="12" text-anchor="middle">나중에</text>

  <text x="600" y="450" fill="#5a6274" font-size="16" text-anchor="middle">조명만 보고 정하면 안 된다. 점선 자리가 같은 플랫폼에 붙어야 씬이 성립한다</text>
</svg>
