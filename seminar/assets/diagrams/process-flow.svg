<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a1b3"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
  </defs>

  <!-- step numbers -->
  <circle cx="125" cy="215" r="18" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
  <text x="125" y="221" fill="#e9ecf2" font-size="18" text-anchor="middle">1</text>
  <circle cx="315" cy="215" r="18" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
  <text x="315" y="221" fill="#e9ecf2" font-size="18" text-anchor="middle">2</text>
  <circle cx="505" cy="215" r="18" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
  <text x="505" y="221" fill="#e9ecf2" font-size="18" text-anchor="middle">3</text>
  <circle cx="695" cy="215" r="18" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
  <text x="695" y="221" fill="#e9ecf2" font-size="18" text-anchor="middle">4</text>
  <circle cx="885" cy="215" r="18" fill="#1a1e27" stroke="#98a1b3" stroke-width="2"/>
  <text x="885" y="221" fill="#e9ecf2" font-size="18" text-anchor="middle">5</text>
  <circle cx="1075" cy="215" r="18" fill="#1a1e27" stroke="#ffb454" stroke-width="2"/>
  <text x="1075" y="221" fill="#e9ecf2" font-size="18" text-anchor="middle">6</text>

  <!-- nodes -->
  <rect x="50" y="260" width="150" height="160" rx="13" fill="#1a1e27" stroke="#98a1b3" stroke-width="3"/>
  <text x="125" y="352" fill="#e9ecf2" font-size="24" font-weight="700" text-anchor="middle">설계</text>

  <rect x="240" y="260" width="150" height="160" rx="13" fill="#1a1e27" stroke="#98a1b3" stroke-width="3"/>
  <text x="315" y="352" fill="#e9ecf2" font-size="24" font-weight="700" text-anchor="middle">조명 제어 도면</text>

  <rect x="430" y="260" width="150" height="160" rx="13" fill="#1a1e27" stroke="#98a1b3" stroke-width="3"/>
  <text x="505" y="352" fill="#e9ecf2" font-size="24" font-weight="700" text-anchor="middle">제품 선정</text>

  <rect x="620" y="260" width="150" height="160" rx="13" fill="#1a1e27" stroke="#98a1b3" stroke-width="3"/>
  <text x="695" y="352" fill="#e9ecf2" font-size="24" font-weight="700" text-anchor="middle">시공</text>

  <rect x="810" y="260" width="150" height="160" rx="13" fill="#1a1e27" stroke="#98a1b3" stroke-width="3"/>
  <text x="885" y="352" fill="#e9ecf2" font-size="24" font-weight="700" text-anchor="middle">설정</text>

  <rect x="1000" y="260" width="150" height="160" rx="50" fill="#1a1e27" stroke="#ffb454" stroke-width="3"/>
  <text x="1075" y="352" fill="#e9ecf2" font-size="24" font-weight="700" text-anchor="middle">피드백 루프</text>

  <!-- flow arrows -->
  <line x1="203" y1="340" x2="237" y2="340" stroke="#98a1b3" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <line x1="393" y1="340" x2="427" y2="340" stroke="#98a1b3" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <line x1="583" y1="340" x2="617" y2="340" stroke="#98a1b3" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <line x1="773" y1="340" x2="807" y2="340" stroke="#98a1b3" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <line x1="963" y1="340" x2="997" y2="340" stroke="#98a1b3" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <!-- feedback loop: 피드백 루프 -> 설정 -->
  <path d="M1075,420 C1075,520 885,520 885,420" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowAmber)"/>

  <!-- caption -->
  <text x="600" y="590" fill="#98a1b3" font-size="24" text-anchor="middle">도면은 고정되고, 시나리오는 계속 바뀐다</text>
</svg>
