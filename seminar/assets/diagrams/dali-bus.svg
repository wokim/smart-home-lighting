<svg viewBox="0 15 1200 575" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="lampGlowDB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffb454" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 분전함 -->
  <g>
    <rect x="60" y="60" width="280" height="150" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="90" y="98" fill="#e9ecf2" font-size="24" font-weight="600">분전함</text>
    <text x="90" y="130" fill="#8b93a5" font-size="18">DALI PSU</text>
    <text x="210" y="130" fill="#8b93a5" font-size="18">DALI 마스터</text>
  </g>

  <!-- legend -->
  <g>
    <line x1="780" y1="71" x2="800" y2="71" stroke="#b48cff" stroke-width="3" stroke-linecap="round"/>
    <text x="810" y="76" fill="#e9ecf2" font-size="16">DALI 버스 (제어)</text>
    <line x1="780" y1="97" x2="800" y2="97" stroke="#b3702d" stroke-width="3" stroke-linecap="round"/>
    <text x="810" y="102" fill="#e9ecf2" font-size="16">전원 L</text>
    <line x1="930" y1="97" x2="950" y2="97" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
    <text x="958" y="102" fill="#e9ecf2" font-size="16">전원 N</text>
  </g>

  <!-- bus + power runs -->
  <text x="470" y="112" fill="#b48cff" font-size="18" text-anchor="middle">DALI 버스 2가닥 · 극성 무관</text>
  <line x1="340" y1="125" x2="1120" y2="125" stroke="#b48cff" stroke-width="2.5" stroke-linecap="round"/>

  <text x="730" y="150" fill="#b3702d" font-size="17" text-anchor="middle">L</text>
  <line x1="340" y1="160" x2="1120" y2="160" stroke="#b3702d" stroke-width="3" stroke-linecap="round"/>

  <line x1="340" y1="195" x2="1120" y2="195" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
  <text x="730" y="215" fill="#58b7ff" font-size="17" text-anchor="middle">N</text>

  <!-- Driver 1 -->
  <g>
    <line x1="390" y1="125" x2="390" y2="260" stroke="#b48cff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="430" y1="160" x2="430" y2="260" stroke="#b3702d" stroke-width="3" stroke-linecap="round"/>
    <line x1="470" y1="195" x2="470" y2="260" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
    <rect x="360" y="260" width="140" height="60" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="430" y="296" fill="#e9ecf2" font-size="18" text-anchor="middle">드라이버 1</text>
    <line x1="430" y1="320" x2="430" y2="400" stroke="#8b93a5" stroke-width="2" stroke-linecap="round"/>
    <text x="450" y="364" fill="#8b93a5" font-size="15" text-anchor="start">출력</text>
    <circle cx="430" cy="438" r="34" fill="url(#lampGlowDB)"/>
    <circle cx="430" cy="438" r="16" fill="none" stroke="#ffd9a0" stroke-width="2.3"/>
    <line x1="418.7" y1="426.7" x2="441.3" y2="449.3" stroke="#ffd9a0" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="441.3" y1="426.7" x2="418.7" y2="449.3" stroke="#ffd9a0" stroke-width="2.3" stroke-linecap="round"/>
    <text x="430" y="486" fill="#8b93a5" font-size="15" text-anchor="middle">등기구</text>
  </g>

  <!-- Driver 2 -->
  <g>
    <line x1="592" y1="125" x2="592" y2="260" stroke="#b48cff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="632" y1="160" x2="632" y2="260" stroke="#b3702d" stroke-width="3" stroke-linecap="round"/>
    <line x1="672" y1="195" x2="672" y2="260" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
    <rect x="562" y="260" width="140" height="60" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="632" y="296" fill="#e9ecf2" font-size="18" text-anchor="middle">드라이버 2</text>
    <line x1="632" y1="320" x2="632" y2="400" stroke="#8b93a5" stroke-width="2" stroke-linecap="round"/>
    <text x="652" y="364" fill="#8b93a5" font-size="15" text-anchor="start">출력</text>
    <circle cx="632" cy="438" r="34" fill="url(#lampGlowDB)"/>
    <circle cx="632" cy="438" r="16" fill="none" stroke="#ffd9a0" stroke-width="2.3"/>
    <line x1="620.7" y1="426.7" x2="643.3" y2="449.3" stroke="#ffd9a0" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="643.3" y1="426.7" x2="620.7" y2="449.3" stroke="#ffd9a0" stroke-width="2.3" stroke-linecap="round"/>
    <text x="632" y="486" fill="#8b93a5" font-size="15" text-anchor="middle">등기구</text>
  </g>

  <!-- Driver 3 -->
  <g>
    <line x1="794" y1="125" x2="794" y2="260" stroke="#b48cff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="834" y1="160" x2="834" y2="260" stroke="#b3702d" stroke-width="3" stroke-linecap="round"/>
    <line x1="874" y1="195" x2="874" y2="260" stroke="#58b7ff" stroke-width="3" stroke-linecap="round"/>
    <rect x="764" y="260" width="140" height="60" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="834" y="296" fill="#e9ecf2" font-size="18" text-anchor="middle">드라이버 3</text>
    <line x1="834" y1="320" x2="834" y2="400" stroke="#8b93a5" stroke-width="2" stroke-linecap="round"/>
    <text x="854" y="364" fill="#8b93a5" font-size="15" text-anchor="start">출력</text>
    <circle cx="834" cy="438" r="34" fill="url(#lampGlowDB)"/>
    <circle cx="834" cy="438" r="16" fill="none" stroke="#ffd9a0" stroke-width="2.3"/>
    <line x1="822.7" y1="426.7" x2="845.3" y2="449.3" stroke="#ffd9a0" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="845.3" y1="426.7" x2="822.7" y2="449.3" stroke="#ffd9a0" stroke-width="2.3" stroke-linecap="round"/>
    <text x="834" y="486" fill="#8b93a5" font-size="15" text-anchor="middle">등기구</text>
  </g>

  <!-- 스위치 박스: 푸시버튼 커플러 (버스 전원, L·N 불필요) -->
  <g>
    <line x1="1036" y1="125" x2="1036" y2="260" stroke="#b48cff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="940" y="260" width="200" height="200" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="1040" y="288" fill="#e9ecf2" font-size="17" font-weight="600" text-anchor="middle">스위치 박스</text>
    <rect x="965" y="302" width="150" height="54" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#b48cff" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="1040" y="324" fill="#e9ecf2" font-size="15" font-weight="600" text-anchor="middle">푸시버튼 커플러</text>
    <text x="1040" y="344" fill="#8b93a5" font-size="12" text-anchor="middle">버스 전원으로 동작</text>
    <circle cx="1000" cy="400" r="4" fill="none" stroke="#e9ecf2" stroke-width="2"/>
    <line x1="1003" y1="397" x2="1040" y2="374" stroke="#e9ecf2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1060" cy="400" r="4" fill="none" stroke="#e9ecf2" stroke-width="2"/>
    <line x1="1000" y1="356" x2="1000" y2="396" stroke="#8b93a5" stroke-width="2" stroke-linecap="round"/>
    <line x1="1060" y1="356" x2="1060" y2="396" stroke="#8b93a5" stroke-width="2" stroke-linecap="round"/>
    <text x="1040" y="432" fill="#8b93a5" font-size="14" text-anchor="middle">기존 벽 스위치</text>
    <text x="1040" y="485" fill="#b48cff" font-size="14" text-anchor="middle">L·N 없이 버스 2가닥만</text>
  </g>
  <!-- caption -->
  <text x="600" y="560" fill="#5a6274" font-size="20" letter-spacing="0.3" text-anchor="middle">한 라인 64주소 · 16그룹 · 16씬 — 드라이버도, 스위치(커플러)도 같은 버스 위의 참여자</text>
</svg>
